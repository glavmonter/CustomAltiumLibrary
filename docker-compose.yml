name: altium-library

x-web-image: &web-image
  build: ./web
  image: altium-library-web:latest

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-altium_library}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?задайте в .env}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-altium_library}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в .env}
      # роли создаёт 10_roles.sh при первом запуске на пустом томе
      LIBRARY_OWNER_PASSWORD: ${LIBRARY_OWNER_PASSWORD:?задайте в .env}
      LIBRARY_WEB_PASSWORD: ${LIBRARY_WEB_PASSWORD:?задайте в .env}
      ALTIUM_READER_PASSWORD: ${ALTIUM_READER_PASSWORD:?задайте в .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db/10_roles.sh:/docker-entrypoint-initdb.d/10_roles.sh:ro
    ports:
      # наружу — для подключения Altium Designer через ODBC
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Схема БД целиком в миграциях Django (library/migrations); выполняются владельцем схем
  migrate:
    <<: *web-image
    entrypoint: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      DB_USER: library_owner
      DB_PASSWORD: ${LIBRARY_OWNER_PASSWORD}

  web:
    <<: *web-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      DB_USER: library_web
      DB_PASSWORD: ${LIBRARY_WEB_PASSWORD}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_LOGIN_REQUIRED: ${DJANGO_LOGIN_REQUIRED:-0}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    ports:
      - "${WEB_PORT:-8000}:8000"

volumes:
  pgdata:
