<div class="library-path" data-library-path
     data-root="{{ widget.root }}" data-extension="{{ widget.extension }}" data-ref-field="{{ widget.ref_field }}"
     data-analyze-url="{{ widget.analyze_url }}" data-max-bytes="{{ widget.max_bytes }}"
     data-preview-field="{{ widget.preview_field }}" data-description-field="{{ widget.description_field }}">
  {% include "django/forms/widgets/input.html" %}
  <div class="library-path__tools">
    <span class="library-path__hint">Перетащите сюда {{ widget.extension }} или вставьте путь — он обрежется до {{ widget.root }}/</span>
    <span class="library-path__root" hidden>
      Папка библиотеки: <b class="library-path__root-name">не выбрана</b>
      <button type="button" class="library-path__root-pick">Выбрать…</button>
    </span>
  </div>
  <div class="library-path__progress" hidden>
    <progress max="100" value="0"></progress>
    <span class="library-path__progress-text" aria-live="polite"></span>
    <button type="button" class="library-path__progress-cancel">Отменить</button>
  </div>
  <div class="library-path__status" aria-live="polite"></div>
</div>
